name: Touchstone

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  touchstone:
    runs-on: ubuntu-latest
    # The suite waits on a gather Job that retries, and its own asserts allow
    # 5m each. Generous enough to survive a slow runner, short enough that a
    # wedged controller does not hold a runner for the default six hours.
    timeout-minutes: 30
    env:
      # renovate: datasource=docker depName=kindest/node
      KIND_NODE_IMAGE: kindest/node:v1.34.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=github-releases depName=casey/just
          just-version: '1.58.0'

      - name: Create the cluster the touchstone expects
        run: |
          go run "sigs.k8s.io/kind@$(just --evaluate KIND_VERSION)" create cluster \
            --name "$(just --evaluate KIND_CLUSTER)" \
            --image "${KIND_NODE_IMAGE}"

      - name: Run the touchstone
        run: just touchstone
