---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: arcana.arcana.helmetica.io
spec:
  group: arcana.helmetica.io
  names:
    kind: Arcanum
    listKind: ArcanumList
    plural: arcana
    singular: arcanum
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.message
      name: Message
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Arcanum is the thing custos keeps.
          The pluralizer would make this "arcanums", so the Latin plural is spelled out.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ArcanumSpec describes what custos guards. It is deliberately near-empty: the
              real fields land here once the resource custos watches over is settled.
            properties:
              suspend:
                description: |-
                  Suspend pauses reconciliation. A suspended arcanum holds at Pending and
                  custos leaves everything it owns untouched, which is the escape hatch
                  when the controller and the cluster disagree.
                type: boolean
            type: object
          status:
            properties:
              message:
                description: Message explains a Pending or Failed phase.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the phase was
                  computed from.
                format: int64
                type: integer
              phase:
                type: string
            type: object
        type: object
