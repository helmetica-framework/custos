apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: credentials
spec:
  description: >-
    Gathers one credential per source against a real API server and checks the
    Secret lands beside the claim. This is the only test that runs the gather
    Job and an exec for real; everything else about custos is covered by the
    unit tests. It installs custos itself, so the only thing it needs of the
    cluster is that `just load-image` has put the gather image on the nodes.
  steps:
    - name: install custos
      description: >-
        The CRDs, which config/default leaves out on purpose, and the manager.
        Running it in the cluster rather than from a developer's kubeconfig is
        also the only time the generated RBAC is exercised at all: everywhere
        else custos runs as whoever started it.
      try:
        - script:
            content: |
              set -eu
              cd ../../..
              go tool sigs.k8s.io/kustomize/kustomize/v5 build test/touchstone/deploy \
                | kubectl apply -f -
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: custos-controller-manager
                namespace: custos-system
              status:
                availableReplicas: 1
      catch:
        - describe:
            apiVersion: apps/v1
            kind: Deployment
            namespace: custos-system
        - podLogs:
            namespace: custos-system
            selector: control-plane=controller-manager
            tail: 50
      cleanup:
        - script:
            content: |
              set -eu
              cd ../../..
              go tool sigs.k8s.io/kustomize/kustomize/v5 build test/touchstone/deploy \
                | kubectl delete --ignore-not-found -f -

    - name: stand in for chrysopoeia
      description: >-
        In a real cluster chryso creates the instance namespace, stamps it with
        the four annotations pointing back at the claim, and binds an
        instance-admin ServiceAccount to the admin ClusterRole. Custos reads
        the annotations and the gather Job borrows the ServiceAccount, so the
        test has to provide both.
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: (join('-', ['x-custos', $namespace]))
                annotations:
                  chrysopoeia.io/claim-namespace: ($namespace)
                  chrysopoeia.io/claim-name: touchstone
                  chrysopoeia.io/claim-kind: ConfigMap
                  chrysopoeia.io/claim-apiVersion: v1
        - apply:
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: instance-admin
                namespace: (join('-', ['x-custos', $namespace]))
        - apply:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: instance-admin
                namespace: (join('-', ['x-custos', $namespace]))
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: admin
              subjects:
                - kind: ServiceAccount
                  name: instance-admin
                  namespace: (join('-', ['x-custos', $namespace]))

    - name: create what the sources read
      description: >-
        A ConfigMap standing in for the claim CR, since a claim is whatever
        kind chryso generated and custos reads it unstructured. A Secret for
        the objectRef, and a pod for the exec.
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: touchstone
                namespace: ($namespace)
              data:
                database: touchstonedb
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: touchstone-app
                namespace: (join('-', ['x-custos', $namespace]))
              stringData:
                username: app
        - apply:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: touchstone
                namespace: (join('-', ['x-custos', $namespace]))
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: touchstone
                template:
                  metadata:
                    labels:
                      app: touchstone
                  spec:
                    containers:
                      - name: shell
                        image: busybox:1.37
                        command: ["sh", "-c", "sleep infinity"]
        # Before the Deployment is Ready, on purpose. Helm applies a reagent
        # chart all at once, so the first exec routinely finds no pod to run
        # in. Waiting here first would test the one ordering that never
        # happens in practice.
        - apply:
            file: arcanum.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: touchstone
                namespace: (join('-', ['x-custos', $namespace]))
              status:
                readyReplicas: 1

    - name: gather the credentials
      description: >-
        The Job resolves the objectRef and the exec inside the instance
        namespace and leaves them in a Secret there. Custos renders the rest
        and writes the target Secret next to the claim. The Job may need a
        retry or two first, since the Arcanum went in before the pod was up.
      timeouts:
        assert: 5m
      try:
        - assert:
            resource:
              apiVersion: arcana.helmetica.io/v1
              kind: Arcanum
              metadata:
                name: credentials
                namespace: (join('-', ['x-custos', $namespace]))
              status:
                phase: Ready
                secretName: touchstone-credentials
                secretNamespace: ($namespace)
      catch:
        - describe:
            apiVersion: arcana.helmetica.io/v1
            kind: Arcanum
            namespace: (join('-', ['x-custos', $namespace]))
        - describe:
            apiVersion: batch/v1
            kind: Job
            namespace: (join('-', ['x-custos', $namespace]))
        - get:
            apiVersion: v1
            kind: ConfigMap
            namespace: (join('-', ['x-custos', $namespace]))
            name: credentials-gather-result
            format: yaml
        - podLogs:
            namespace: custos-system
            selector: control-plane=controller-manager
            tail: 50

    - name: check every key
      description: >-
        One key per source, and the template built out of the four before it.
        The Secret is in the claim namespace, which is where a consumer can
        actually reach it.
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: touchstone-credentials
                namespace: ($namespace)
                labels:
                  custos.helmetica.io/arcanum-name: credentials
              type: Opaque
              (data.HOST | base64_decode(@)): touchstone-rw
              (data.DATABASE | base64_decode(@)): touchstonedb
              (data.USERNAME | base64_decode(@)): app
              (data.PASSWORD | base64_decode(@)): hunter2
              (data.URL | base64_decode(@)): postgres://app:hunter2@touchstone-rw:5432/touchstonedb

    - name: deleting the arcanum takes the credentials with it
      description: >-
        The Secret is in another namespace, so no owner reference can reach it
        and the finalizer is the only thing that cleans it up.
      try:
        - delete:
            ref:
              apiVersion: arcana.helmetica.io/v1
              kind: Arcanum
              name: credentials
              namespace: (join('-', ['x-custos', $namespace]))
        - error:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: touchstone-credentials
                namespace: ($namespace)
