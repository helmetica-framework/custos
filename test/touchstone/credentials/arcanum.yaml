# One Arcanum using every source there is. It lives in the instance namespace
# and its Secret lands beside the claim, which is the case the annotations on
# that namespace select.
apiVersion: arcana.helmetica.io/v1
kind: Arcanum
metadata:
  name: credentials
  namespace: (join('-', ['x-custos', $namespace]))
spec:
  target:
    name: touchstone-credentials
  credentials:
    valueMapping:
      # A literal, and the one thing that needs no lookup at all.
      HOST:
        source: const
        value: touchstone-rw
      # Read out of the claim CR. The path is bare, without braces, which is
      # the only spelling a claimParam accepts.
      DATABASE:
        source: claimParam
        path: .data.database
      # Read out of an object in the instance namespace. Custos itself cannot
      # do this, so it is one of the two things the gather Job is for. The
      # name is rendered against the metadata first.
      USERNAME:
        source: objectRef
        kind: Secret
        name: "{{.ClaimName}}-app"
        key: username
      # The other one. An exec may provision, so this is also what makes the
      # gather Job run at most once per plan.
      PASSWORD:
        source: exec
        podSelector:
          matchLabels:
            app: touchstone
        command:
          - sh
          - -c
          - printf 'hunter2'
      # Built from the four above, after they have all resolved.
      URL:
        source: template
        value: "postgres://{{.USERNAME}}:{{.PASSWORD}}@{{.HOST}}:5432/{{.DATABASE}}"
